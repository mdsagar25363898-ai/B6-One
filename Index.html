<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B6 One - Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0d15;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ===== লোগো কন্টেইনার ===== */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(18, 22, 36, 0.6);
            backdrop-filter: blur(12px);
            padding: 20px 40px 20px 28px;
            border-radius: 60px;
            border: 1px solid rgba(0, 200, 255, 0.15);
            box-shadow: 0 0 60px rgba(0, 150, 255, 0.08);
            transition: 0.3s;
        }

        .logo-container:hover {
            border-color: rgba(0, 200, 255, 0.35);
            box-shadow: 0 0 80px rgba(0, 150, 255, 0.15);
        }

        /* ===== আইকন ===== */
        .logo-icon {
            position: relative;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* সাই-ফাই রিং */
        .ring-outer {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            border-top-color: #00d4ff;
            border-right-color: #7b4dff;
            animation: spin 4s linear infinite;
        }

        .ring-inner {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: #00ff88;
            border-left-color: #ff6bcb;
            animation: spin 3s linear infinite reverse;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* সেন্টারে B6 */
        .icon-center {
            position: relative;
            z-index: 2;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #b3f0ff, #4dc9f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(0, 180, 255, 0.3);
        }

        .icon-center small {
            font-size: 0.9rem;
            font-weight: 500;
            background: linear-gradient(135deg, #ff6bcb, #ff9a56);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-left: 1px;
        }

        /* ===== টেক্সট পার্ট ===== */
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .logo-text .main {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e0f0ff, #7fc9ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-text .main .highlight {
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text .sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: #7a9bcb;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text .sub .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff88;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ===== রেসপন্সিভ ===== */
        @media (max-width: 500px) {
            .logo-container {
                padding: 16px 24px 16px 18px;
                gap: 14px;
                border-radius: 40px;
            }
            .logo-icon { width: 56px; height: 56px; }
            .ring-outer { width: 56px; height: 56px; }
            .ring-inner { width: 44px; height: 44px; }
            .icon-center { font-size: 1.5rem; }
            .logo-text .main { font-size: 1.8rem; }
            .logo-text .sub { font-size: 0.6rem; letter-spacing: 1.5px; }
        }
    </style>
</head>
<body>

    <!-- ===== লোগো ===== -->
    <div class="logo-container">
        <!-- আইকন -->
        <div class="logo-icon">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="icon-center">B<small>6</small></div>
        </div>

        <!-- টেক্সট -->
        <div class="logo-text">
            <div class="main">
                <span class="highlight">B</span>6 <span class="highlight">O</span>ne
            </div>
            <div class="sub">
                <span class="dot"></span> AI AUTOMATION
            </div>
        </div>
    </div>

</body>
</html>
